        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">

        <div class="container">

            <br />

            <h1>Your Internet Traffic Info</h1>

            <br />

            <p>IP Address: <span id="ip-address"></span></p>

            <p>City: <span id="city"></span></p>

            <p>Region <span id="region"></span></p>

            <p>Country: <span id="country"></span></p>

            <p>ISP: <span id="isp"></span></p>

            <p>Latitude: <span id="latitude"></span></p>

            <p>Longitude: <span id="longitude"></span></p>

        </div>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

        <script>

            $(document).ready(function() {

                $.getJSON("https://api.ipify.org?format=json", function(data) {

                    $.getJSON("https://ipapi.co/" + data.ip + "/json/", function(locationData) {

                        console.log("locationData / "+ JSON.stringify(locationData));

                        $("#ip-address").text(locationData.ip);

                        $("#city").text(locationData.city);

                        $("#region").text(locationData.region);

                        $("#country").text(locationData.country_name);

                        $("#isp").text(locationData.org);

                        $("#latitude").text(locationData.latitude);

                        $("#longitude").text(locationData.longitude);

                    });

                });

            });
            
        </script>

    </body>
